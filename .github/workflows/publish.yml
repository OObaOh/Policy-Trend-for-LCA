name: Collect intelligence and publish site

on:
  workflow_dispatch:
  schedule:
    # 00:13 UTC = 09:13 KST, every day
    - cron: '13 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/**'
      - 'config/**'
      - 'site/**'
      - 'requirements.txt'
      - 'tests/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: policy-lca-site
  cancel-in-progress: false

jobs:
  collect:
    name: Collect verified sources and build website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run regression tests
        run: python -m pytest -q
      - name: Collect new policy and LCA metadata
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research-now]')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_AI_PER_RUN: '6'
          LOOKBACK_DAYS: '14'
          MAX_NEW_ITEMS: '60'
          MAX_SOURCE_READ_PER_RUN: '12'
        run: python scripts/collect.py
      - name: Save archive updates to GitHub
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[research-now]')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/articles.json
          if git diff --cached --quiet; then
            echo "No archive changes to save."
          else
            git commit -m "data: update policy and LCA research archive"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    name: Deploy research dashboard
    runs-on: ubuntu-latest
    needs: collect
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
